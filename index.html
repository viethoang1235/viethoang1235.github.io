<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gửi Ry Húi 💖</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Nền hiệu ứng sao lấp lánh */
        .stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .star {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            animation: twinkle var(--duration) infinite ease-in-out;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        /* Màn hình khởi động */
        #start-screen {
            position: absolute;
            z-index: 10;
            text-align: center;
            cursor: pointer;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            animation: pulse-box 2s infinite;
        }

        @keyframes pulse-box {
            0%, 100% { transform: scale(1); box-shadow: 0 0 15px rgba(255, 105, 180, 0.3); }
            50% { transform: scale(1.03); box-shadow: 0 0 25px rgba(255, 105, 180, 0.6); }
        }

        #start-screen h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 2.8rem;
            color: #ff758c;
            margin-bottom: 10px;
        }

        #start-screen p {
            font-size: 1rem;
            color: #ddd;
        }

        /* Khung hiển thị chính */
        #main-container {
            display: none;
            position: relative;
            z-index: 5;
            width: 90%;
            max-width: 500px;
            text-align: center;
            background: rgba(20, 20, 35, 0.7);
            backdrop-filter: blur(15px);
            border-radius: 25px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 30px 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }

        /* Khung ảnh động độc lập */
        .image-container {
            width: 180px;
            height: 180px;
            margin: 0 auto 20px auto;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            position: relative;
        }

        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        /* Các kiểu animation khác nhau cho từng bức ảnh */
        .anim-zoom img {
            animation: zoomEffect 4s infinite alternate ease-in-out;
        }
        @keyframes zoomEffect {
            0% { transform: scale(1); }
            100% { transform: scale(1.15); }
        }

        .anim-rotate img {
            animation: rotateEffect 6s infinite linear;
        }
        @keyframes rotateEffect {
            0% { transform: rotate(0deg) scale(1.05); }
            50% { transform: rotate(5deg) scale(1.1); }
            100% { transform: rotate(0deg) scale(1.05); }
        }

        .anim-bounce img {
            animation: bounceEffect 3s infinite ease-in-out;
        }
        @keyframes bounceEffect {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-8px) scale(1.08); }
        }

        .anim-glow img {
            animation: glowEffect 3.5s infinite ease-in-out;
        }
        @keyframes glowEffect {
            0%, 100% { transform: scale(1); filter: brightness(1); }
            50% { transform: scale(1.1); filter: brightness(1.2) hue-rotate(15deg); }
        }

        /* Khung chữ xuất hiện từng dòng */
        #text-box {
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }

        .message-line {
            font-size: 1.25rem;
            line-height: 1.6;
            color: #f1f1f1;
            opacity: 0;
            transform: translateY(15px);
            transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            position: absolute;
            width: 85%;
        }

        .message-line.active {
            opacity: 1;
            transform: translateY(0);
        }

        /* Chữ ký người gửi */
        .signature {
            font-family: 'Dancing Script', cursive;
            font-size: 2rem;
            color: #ff758c;
            margin-top: 15px;
            opacity: 0;
            transition: opacity 1s ease;
        }

        .signature.show {
            opacity: 1;
        }

        /* Hiệu ứng hoa bay/trái tim bay nền */
        .floating-element {
            position: absolute;
            bottom: -50px;
            z-index: 2;
            user-select: none;
            pointer-events: none;
            animation: floatUp 5s linear infinite;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(-110vh) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <!-- Nền sao lấp lánh -->
    <div class="stars" id="stars"></div>

    <!-- Màn hình chào ban đầu -->
    <div id="start-screen" onclick="beginExperience()">
        <h1>Xin chào Ry Húi ✨</h1>
        <p>Bấm vào đây để mở món quà nhỏ từ VH nhé!</p>
    </div>

    <!-- Giao diện chính -->
    <div id="main-container">
        <!-- Khu vực hiển thị ảnh với animation thay đổi -->
        <div class="image-container" id="img-wrapper">
            <img id="dynamic-image" src="" alt="Mừng 20/10">
        </div>

        <!-- Khu vực hiển thị lời chúc tuần tự -->
        <div id="text-box">
            <!-- Các dòng chữ sẽ được chèn bằng Javascript -->
        </div>

        <div class="signature" id="signature">Từ VH gửi với tất cả thương yêu 🤍</div>
    </div>

    <!-- Nhạc nền Việt Nam có lời (Sử dụng liên kết audio ổn định) -->
    <audio id="bg-music" loop>
        <source src="https://audio.jukehost.co.uk/q1m3aU5Wv5Xj0H4Yn2Z5B9K7L1M3N5P7" type="audio/mp3">
        <!-- Link dự phòng nếu link trên lỗi -->
        <source src="https://p.scdn.co/mp3-preview/7c37a1e05d048455d326f5f3e9f45688b1f28b43?cid=2544299b82af4d7fb6a13fbc485b848a" type="audio/mp3">
    </audio>

    <script>
        // Tạo hiệu ứng sao nền
        const starsContainer = document.getElementById('stars');
        for (let i = 0; i < 60; i++) {
            const star = document.createElement('div');
            star.classList.add('star');
            star.style.width = `${Math.random() * 3}px`;
            star.style.height = star.style.width;
            star.style.top = `${Math.random() * 100}%`;
            star.style.left = `${Math.random() * 100}%`;
            star.style.setProperty('--duration', `${2 + Math.random() * 3}s`);
            starsContainer.appendChild(star);
        }

        // Dữ liệu nội dung: mỗi bước gồm Ảnh, Hiệu ứng ảnh và Lời chúc tương ứng
        const storySteps = [
            {
                img: "https://images.unsplash.com/photo-1518895949257-7621c3c786d7?w=500&auto=format&fit=crop&q=60",
                anim: "anim-zoom",
                text: "Hôm nay là một ngày đặc biệt..."
            },
            {
                img: "https://images.unsplash.com/photo-1522335789203-aabd1fc54bc9?w=500&auto=format&fit=crop&q=60",
                anim: "anim-rotate",
                text: "Ngày 20/10 dành riêng cho những cô gái tuyệt vời."
            },
            {
                img: "https://images.unsplash.com/photo-1490750967868-88aa4486c946?w=500&auto=format&fit=crop&q=60",
                anim: "anim-bounce",
                text: "VH muốn gửi đến Ry Húi những lời chúc tốt đẹp nhất!"
            },
            {
                img: "https://images.unsplash.com/photo-1526047932273-341f2a7631f9?w=500&auto=format&fit=crop&q=60",
                anim: "anim-glow",
                text: "Chúc Ry luôn xinh đẹp, rạng rỡ và luôn mỉm cười mỗi ngày nhé! 🌸"
            }
        ];

        let currentStep = 0;
        const imgWrapper = document.getElementById('img-wrapper');
        const dynamicImage = document.getElementById('dynamic-image');
        const textBox = document.getElementById('text-box');
        const signature = document.getElementById('signature');

        function beginExperience() {
            // Ẩn màn hình chào, hiện khung chính
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('main-container').style.display = 'block';

            // Phát nhạc nền
            const music = document.getElementById('bg-music');
            music.play().catch(e => console.log("Trình duyệt chặn tự động phát nhạc:", e));

            // Bắt đầu chạy các bước lời chúc
            showStep();
            
            // Định kỳ sinh hiệu ứng bay lơ lửng (trái tim, hoa)
            setInterval(createFloatingIcon, 400);
        }

        function showStep() {
            if (currentStep < storySteps.length) {
                const step = storySteps[currentStep];

                // Đổi ảnh và hiệu ứng animation khung ảnh
                dynamicImage.src = step.img;
                imgWrapper.className = "image-container " + step.anim;

                // Xóa nội dung cũ và tạo dòng chữ mới hiện dần
                textBox.innerHTML = '';
                const line = document.createElement('div');
                line.className = 'message-line';
                line.innerText = step.text;
                textBox.appendChild(line);

                // Hiệu ứng Fade in chữ
                setTimeout(() => {
                    line.classList.add('active');
                }, 100);

                // Thời gian hiển thị mỗi dòng trước khi chuyển sang dòng tiếp theo
                let displayTime = 4000;
                currentStep++;

                setTimeout(showStep, displayTime);
            } else {
                // Khi hết các dòng chúc, hiện chữ ký người gửi
                signature.classList.add('show');
            }
        }

        // Tạo hiệu ứng phần tử bay (trái tim, hoa hồng) ngẫu nhiên
        function createFloatingIcon() {
            const icons = ['❤️', '🌸', '✨', '💖', '🌷'];
            const el = document.createElement('div');
            el.classList.add('floating-element');
            el.style.left = Math.random() * 100 + 'vw';
            el.style.fontSize = (Math.random() * 15 + 15) + 'px';
            el.style.animationDuration = (Math.random() * 3 + 3) + 's';
            el.innerHTML = icons[Math.floor(Math.random() * icons.length)];
            document.body.appendChild(el);

            setTimeout(() => {
                el.remove();
            }, 6000);
        }
    </script>
</body>
</html>
